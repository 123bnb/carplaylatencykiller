name: Build CarPlayLatencyKiller

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos
        run: git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

      - name: Clone iOS SDKs
        run: git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks"

      - name: Build package
        run: make clean package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayLatencyKiller
          path: packages/*.deb
