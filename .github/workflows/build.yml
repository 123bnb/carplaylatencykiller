name: Build CarPlayLatencyKiller

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get patched iOS 16.5 SDK (contains private Preferences framework)
        # 新版 Xcode 自带 SDK 删除了 Preferences 私有框架/头，必须用 theos/sdks 的
        # patched SDK（含私有框架），设置页才能 import 真头并链接，复刻成功案例环境。
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build package
        run: make clean package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayLatencyKiller
          path: packages/*.deb
