name: Build CarPlayLatencyKiller

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        # 必须用 RootHide 的 Theos fork（github.com/roothide/theos）编译，
        # 标准 theos 只能编 rootless，Sileo 会判定“不是 roothide”。
        # --recursive 拉全 vendor 子模块（含 dm.pl、ldid、libroothide）。
        # 编译用 runner 自带 Xcode SDK（Makefile 已用 TARGET=latest）。
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Install dpkg & ldid
        # macOS runner 默认无 dpkg（打 deb 依赖）与 ldid（签名依赖）。
        run: brew install dpkg ldid

      - name: Build package
        run: make clean package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayLatencyKiller
          path: packages/*.deb
